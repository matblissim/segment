# Configuration Nginx pour locked-in.fr avec SSL
# Fichier: /etc/nginx/sites-available/locked-in.fr

# Redirection HTTP vers HTTPS
server {
    listen 80;
    server_name locked-in.fr www.locked-in.fr;

    # Permettre à Certbot de valider le domaine
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Rediriger tout le reste vers HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Configuration HTTPS
server {
    listen 443 ssl http2;
    server_name locked-in.fr www.locked-in.fr;

    # Certificats SSL (seront générés par Certbot)
    ssl_certificate /etc/letsencrypt/live/locked-in.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locked-in.fr/privkey.pem;

    # Configuration SSL moderne et sécurisée
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # API Backend - Proxy vers Node.js
    location /api {
        proxy_pass http://localhost:3001/api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Routes d'authentification
    location /auth {
        proxy_pass http://localhost:3001/auth;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend - Fichiers statiques
    location / {
        root /home/mathieudottir/strava-gamification/client/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Sécurité headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
